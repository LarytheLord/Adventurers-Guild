name: dpdp-kit

on:
  push:
    branches: [main]
    paths:
      - 'tools/dpdp-kit/**'
      - '.github/workflows/dpdp-kit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/dpdp-kit/**'
      - '.github/workflows/dpdp-kit.yml'

permissions:
  contents: read

jobs:
  test:
    name: dpdp-kit type-check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/dpdp-kit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/dpdp-kit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test
