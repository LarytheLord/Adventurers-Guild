name: PR Issue Link Check

# Passes when the PR title/body has a closing reference ("Closes #N"),
# OR the PR has the "no-issue" label, OR the author is the repo owner.
# The logic lives in .github/scripts/pr-issue-link-check.cjs (unit tested).

on:
  pull_request:
    branches: [main, development]
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  require-closing-reference:
    name: Require closing issue reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check issue reference, label, or owner
        uses: actions/github-script@v7
        with:
          script: |
            const { evaluate } = require('./.github/scripts/pr-issue-link-check.cjs');
            const result = evaluate(context.payload.pull_request, context.repo.owner);
            if (result.ok) {
              core.info(`OK: ${result.reason}`);
            } else {
              core.setFailed(result.reason);
            }
